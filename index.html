footer{border-top:1px solid var(--line)}

 <p class="ctx">${w.c}</p>
 <div class="cols"><div><h4>${L().did}</h4><ul>${w.d.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4>${L().res}</h4><ul>${w.o.map(x=>`<li>${x}</li>`).join('')}</ul>${w.u?`<p><a class="more" href="${w.u}">${L().open} →</a></p>`:''}</div></div>
 ${w.im.length?`<div class="shots">${w.im.map((m,j)=>`<figure><img src="${m[0]}.jpg" alt="${w.cap[j]||''}"><figcaption>${w.cap[j]||''}${lang==='zh'?'（'+L().page+'）':' ('+L().page+')'}</figcaption></figure>`).join('')}</div>`:`<p class="note">${L().client}</p>`}
 <div class="nav2"><button type="button" id="prev">← ${L().prev}</button><button type="button" id="next">${L().next} →</button></div>`;
 dlg.classList.add('on'); document.body.style.overflow='hidden';
 if(!keep){sheet.scrollTop=0;$('close').focus()}
};
const close=()=>{dlg.classList.remove('on');openId=null;document.body.style.overflow='';if(last)last.focus()};
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('fc-lang',lang)}catch(err){}render()});
chips.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.f;render()});
grid.addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;last=b;open(b.dataset.id)});
sheet.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.id==='close')return close();
 const i=W.findIndex(w=>w.id===openId);
 if(t.id==='prev')open(W[(i-1+W.length)%W.length].id);
 if(t.id==='next')open(W[(i+1)%W.length].id);});
dlg.addEventListener('click',e=>{if(e.target===dlg)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dlg.classList.contains('on'))close()});
render();
}</script>
</body></html>
